# 10 user UAVs, 3 edge UAVs, 1 cloud. LOCAL remains intentionally stressed:
# each user receives more CPU work than its 0.5 GHz processor can sustain.
# Edge/cloud offloading remains possible over a harsh 6 Mbps 802.11g link-budget.
# The deadline is reporting-only; it is not part of the objective.
seed: 7
num_users: 10
num_edges: 3
num_clouds: 1
num_subtasks: 2
episode_duration_s: 60.0
arrival_rate_per_user: 1.5
input_size_mb: 1.0
output_size_mb: 0.1
cpu_cycles_per_task: 2000000000
memory_mb_per_task: 128.0
deadline_s: 2.0
drop_latency_s: 10.0
user_cpu_hz: 500000000
edge_cpu_hz: 2000000000
cloud_cpu_hz: 20000000000
user_memory_mb: 512
edge_memory_mb: 2048
cloud_memory_mb: 32768
user_battery_j: 1000
edge_battery_j: 1500
cloud_battery_j: 1000000000000
cpu_energy_coefficient: 1.0e-29
radio_tx_w: 5.0
radio_rx_w: 3.0
wifi_standard: 802.11g
wifi_phy_rate_mbps: 6.0
per_link_bandwidth_mbps: 6.0
path_loss_exponent: 2.8
shadowing_std_db: 4.0
min_link_rate_mbps: 0.5
latency_reference_s: 1.0
energy_reference_j: 10.0
imbalance_reference: 1.0
objective_weights:
  latency: 0.6
  energy: 0.2
  imbalance: 0.2
  deadline_penalty: 0.0
observation_dim: 60
action_dim: 16
training:
  gamma: 0.995
  reward_scale: 0.01
  dqn:
    learning_rate: 0.0002
    batch_size: 128
    replay_capacity: 100000
    warmup_steps: 1200
    target_update_interval: 1000
    n_step: 3
    train_frequency: 4
    max_grad_norm: 1.0
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_steps: 70000
  ppo:
    learning_rate: 0.00015
    gae_lambda: 0.95
    clip: 0.2
    entropy_coef: 0.01
    value_coef: 0.5
    max_grad_norm: 0.5
    target_kl: 0.02
    value_clip: 0.2
    update_epochs: 8
    minibatch_size: 128
